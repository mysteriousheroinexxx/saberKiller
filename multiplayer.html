<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saber Killer — Multiplayer Prototype (Phase 1)</title>
  <style>
    @font-face {
      font-family: 'Rubik';
      src: url('assets/ui/fonts/Rubik-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Rubik';
      src: url('assets/ui/fonts/Rubik-Medium.ttf') format('truetype');
      font-weight: 500;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c0b0a;
      color: #edece6;
      font-family: 'Rubik', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
    }

    /* Minimal Budget-Backrooms Glass Overlay */
    #lobby-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 440px;
      padding: 32px;
      background: rgba(18, 17, 16, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.08);
      z-index: 10;
      border-radius: 4px;
    }

    .title-badge {
      font-size: 11px;
      letter-spacing: 2px;
      color: #d4af37;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: #edece6;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      letter-spacing: 1px;
      color: #9c9a92;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      background: rgba(10, 10, 10, 0.8);
      border: 1px solid rgba(156, 154, 146, 0.3);
      color: #edece6;
      font-family: 'Rubik', monospace;
      font-size: 14px;
      border-radius: 3px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #d4af37;
    }

    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      flex: 1;
      padding: 12px 16px;
      background: rgba(28, 26, 22, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.5);
      color: #edece6;
      font-family: 'Rubik', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s;
    }

    button:hover {
      background: rgba(212, 175, 55, 0.2);
      border-color: #d4af37;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
    }

    button:active {
      transform: translateY(1px);
    }

    #connection-status {
      margin-top: 18px;
      font-size: 12px;
      color: #9c9a92;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #7a7872;
      text-decoration: none;
      letter-spacing: 1px;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #d4af37;
    }

    /* Minimal In-Game HUD */
    #hud-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    #hud-topbar {
      position: absolute;
      top: 24px;
      left: 28px;
      display: flex;
      gap: 20px;
      align-items: center;
      background: rgba(18, 17, 16, 0.7);
      padding: 8px 16px;
      border-left: 2px solid #d4af37;
      border-radius: 2px;
    }

    #room-info {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: #edece6;
    }

    #player-count {
      font-size: 12px;
      letter-spacing: 1px;
      color: #d4af37;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(237, 236, 230, 0.75);
    }
    #crosshair::before {
      top: 5px; left: 0; width: 12px; height: 2px;
    }
    #crosshair::after {
      top: 0; left: 5px; width: 2px; height: 12px;
    }

    #controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 1.5px;
      color: rgba(156, 154, 146, 0.6);
      text-transform: uppercase;
    }

    #error-banner {
      display: none;
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(180, 40, 40, 0.9);
      color: #fff;
      padding: 10px 24px;
      font-size: 12px;
      letter-spacing: 1px;
      border-radius: 3px;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Minimal Join / Create Modal -->
  <div id="lobby-panel">
    <div class="title-badge">Saber Killer // Multiplayer Module</div>
    <h1>Level 0 Prototype</h1>

    <div class="form-group">
      <label for="server-address">Server Address (Host / IP:Port)</label>
      <input type="text" id="server-address" spellcheck="false">
    </div>

    <div class="form-group">
      <label for="room-code-input">Room Code</label>
      <input type="text" id="room-code-input" placeholder="e.g. ALPHA" maxlength="8" spellcheck="false">
    </div>

    <div class="button-row">
      <button id="btn-create-room">Create Room</button>
      <button id="btn-join-room">Join Room</button>
    </div>

    <div id="connection-status">Connecting to server...</div>
    <a href="index.html" class="back-link">&larr; Return to Story Mode</a>
  </div>

  <!-- Minimal Gameplay HUD -->
  <div id="hud-overlay">
    <div id="hud-topbar">
      <div id="room-info">ROOM: ----</div>
      <div id="player-count">PLAYERS: 1 / 2</div>
    </div>
    <div id="crosshair"></div>
    <div id="controls-hint">WASD / Shift: Move &middot; Mouse: Look &middot; Click: Lock Mouse</div>
  </div>

  <div id="error-banner"></div>

  <script>
    window.__errors = [];
    window.addEventListener('error', e => { window.__errors.push(String(e.message)); });
  </script>

  <!-- Three.js r147 Vendored Engine & Loaders -->
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <!-- Isolated Multiplayer Client Module -->
  <script type="module" src="js/multiplayer/main.js"></script>
</body>
</html>
